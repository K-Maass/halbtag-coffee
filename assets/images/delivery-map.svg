<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-label="Map of the Halbtag delivery area: zone 1 is the city of Zurich, zone 2 covers Limmattal, Glattal and both lake shores up to Thalwil and Küsnacht">
  <defs>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#23190f" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="800" height="640" fill="#f3ecdf"/>
  <rect width="800" height="640" fill="url(#dots)"/>

  <!-- zone 2 -->
  <path d="M58 214 C 120 170, 230 176, 300 150 C 360 90, 420 40, 500 56 C 590 74, 640 150, 650 230
           C 662 300, 640 360, 640 420 C 640 470, 600 520, 520 560 C 470 584, 420 590, 384 560
           C 344 530, 300 520, 278 470 C 250 420, 220 380, 160 356 C 96 330, 40 300, 58 214 Z"
        fill="#c9c7a6" stroke="#23190f" stroke-width="2" stroke-dasharray="7 6" opacity="0.95"/>

  <!-- zone 1: city of Zurich -->
  <path d="M232 250 C 238 200, 290 160, 352 150 C 420 140, 488 150, 520 200
           C 548 244, 540 300, 512 340 C 488 376, 440 400, 400 404 C 350 408, 300 390, 268 352
           C 244 324, 228 290, 232 250 Z"
        fill="#e0a865" stroke="#23190f" stroke-width="2.5"/>

  <!-- lake and rivers -->
  <path d="M396 380 C 420 384, 440 398, 460 420 C 500 466, 548 512, 604 552 C 652 586, 716 612, 800 626
           L 800 598 C 728 586, 672 562, 628 530 C 576 492, 530 448, 492 408 C 466 382, 436 370, 410 370 C 400 370, 392 374, 396 380 Z"
        fill="#9ec0c4" stroke="#23190f" stroke-width="2"/>
  <path d="M404 384 C 380 360, 360 330, 330 316 C 290 296, 250 280, 200 270 C 150 260, 100 262, 40 276 L 0 284"
        fill="none" stroke="#9ec0c4" stroke-width="9" stroke-linecap="round"/>
  <path d="M404 384 C 380 360, 360 330, 330 316 C 290 296, 250 280, 200 270 C 150 260, 100 262, 40 276 L 0 284"
        fill="none" stroke="#23190f" stroke-width="1.2" opacity="0.5"/>
  <path d="M290 640 C 300 580, 318 520, 330 470 C 340 420, 350 380, 360 340"
        fill="none" stroke="#9ec0c4" stroke-width="5" stroke-linecap="round"/>

  <!-- places -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#23190f">
    <g font-size="13">
      <circle cx="120" cy="262" r="4"/><text x="84" y="250">Dietikon</text>
      <circle cx="182" cy="282" r="4"/><text x="168" y="306">Schlieren</text>
      <circle cx="420" cy="88" r="4"/><text x="430" y="92">Kloten</text>
      <circle cx="400" cy="128" r="4"/><text x="390" y="132" text-anchor="end">Opfikon</text>
      <circle cx="498" cy="128" r="4"/><text x="508" y="132">Wallisellen</text>
      <circle cx="580" cy="222" r="4"/><text x="590" y="226">Dübendorf</text>
      <circle cx="588" cy="432" r="4"/><text x="598" y="436">Küsnacht</text>
      <circle cx="430" cy="452" r="4"/><text x="360" y="456">Kilchberg</text>
      <circle cx="500" cy="556" r="4"/><text x="440" y="560">Thalwil</text>
      <circle cx="320" cy="512" r="4"/><text x="258" y="516">Adliswil</text>
    </g>
    <text x="380" y="252" font-size="22" font-family="Georgia, serif" text-anchor="middle">Zürich</text>
    <text x="380" y="274" font-size="12.5" text-anchor="middle" letter-spacing="0.5">8001–8099</text>
    <text x="640" y="548" font-size="13" font-style="italic" fill="#2f5f65" transform="rotate(33 640 548)">Zürichsee</text>
  </g>

  <!-- roastery -->
  <g transform="translate(318 300)">
    <circle r="15" fill="#23190f"/>
    <path d="M-9 0a9 9 0 0 1 18 0z" fill="#d6a056"/>
    <path d="M-9 0a9 9 0 0 0 18 0z" fill="#f5f0e6"/>
  </g>
  <text x="340" y="302" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#23190f">Roastery, Kreis 5</text>

  <!-- legend -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#23190f">
    <rect x="24" y="530" width="200" height="88" rx="6" fill="#fbf8f2" stroke="#23190f" stroke-width="1.5"/>
    <rect x="40" y="546" width="16" height="16" rx="3" fill="#e0a865" stroke="#23190f" stroke-width="1.5"/>
    <text x="66" y="559">Zone 1 · city</text>
    <rect x="40" y="574" width="16" height="16" rx="3" fill="#c9c7a6" stroke="#23190f" stroke-width="1.5"/>
    <text x="66" y="587">Zone 2 · around the city</text>
    <path d="M40 607 H90" stroke="#23190f" stroke-width="2"/>
    <path d="M40 602 V611 M90 602 V611" stroke="#23190f" stroke-width="2"/>
    <text x="98" y="611" font-size="11.5">about 2 km</text>
  </g>
  <!-- north -->
  <g transform="translate(748 48)" font-family="Helvetica, Arial, sans-serif">
    <path d="M0 -22 L9 10 L0 4 L-9 10 Z" fill="#23190f"/>
    <text y="28" font-size="12" text-anchor="middle" fill="#23190f">N</text>
  </g>
</svg>
